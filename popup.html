<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Focused</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <!-- Top bar: mode tabs + settings toggle -->
      <header class="topbar">
        <nav class="modes" id="modes">
          <button class="mode-btn is-active" data-mode="focus">Focus</button>
          <button class="mode-btn" data-mode="short">Short break</button>
          <button class="mode-btn" data-mode="long">Long break</button>
        </nav>
        <button
          class="icon-btn"
          id="settingsToggle"
          title="Settings"
          aria-label="Settings"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.14.43.5.77.93.9.22.07.44.1.66.1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </header>

      <!-- Main timer view -->
      <main class="timer-view" id="timerView">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 240 240" width="220" height="220">
            <circle class="ring-track" cx="120" cy="120" r="108" />
            <circle
              class="ring-progress"
              id="ringProgress"
              cx="120"
              cy="120"
              r="108"
            />
          </svg>
          <div class="ring-center">
            <div class="time" id="timeDisplay">25:00</div>
            <div class="session-label" id="sessionLabel">Session 1 of 4</div>
          </div>
        </div>

        <div class="controls">
          <button class="btn btn-ghost" id="resetBtn">Reset</button>
          <button class="btn btn-primary" id="startBtn">Start</button>
          <button class="btn btn-ghost" id="skipBtn">Skip</button>
        </div>
      </main>

      <!-- Settings view -->
      <section class="settings-view" id="settingsView" hidden>
        <h2 class="settings-title">Durations</h2>

        <label class="field">
          <span>Focus</span>
          <div class="stepper">
            <button class="step-btn" data-target="focus" data-dir="-1">
              −
            </button>
            <input type="number" id="focusInput" min="1" max="120" value="25" />
            <button class="step-btn" data-target="focus" data-dir="1">+</button>
          </div>
        </label>

        <label class="field">
          <span>Short break</span>
          <div class="stepper">
            <button class="step-btn" data-target="short" data-dir="-1">
              −
            </button>
            <input type="number" id="shortInput" min="1" max="60" value="5" />
            <button class="step-btn" data-target="short" data-dir="1">+</button>
          </div>
        </label>

        <label class="field">
          <span>Long break</span>
          <div class="stepper">
            <button class="step-btn" data-target="long" data-dir="-1">−</button>
            <input type="number" id="longInput" min="1" max="90" value="15" />
            <button class="step-btn" data-target="long" data-dir="1">+</button>
          </div>
        </label>

        <label class="field">
          <span>Sessions before long break</span>
          <div class="stepper">
            <button class="step-btn" data-target="cycles" data-dir="-1">
              −
            </button>
            <input type="number" id="cyclesInput" min="2" max="8" value="4" />
            <button class="step-btn" data-target="cycles" data-dir="1">
              +
            </button>
          </div>
        </label>

        <label class="field field-row">
          <span>Alarm sound</span>
          <select id="soundSelect">
            <option value="classic">Classic bell</option>
            <option value="digital">Digital pulse</option>
            <option value="chime">Soft chime</option>
          </select>
        </label>

        <button class="btn btn-primary btn-full" id="doneBtn">Done</button>
      </section>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
